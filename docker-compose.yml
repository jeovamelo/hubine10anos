services:
  hubine10anos-db:
    image: postgres:16-alpine
    container_name: hubine10anos-db
    restart: always
    environment:
      POSTGRES_DB: hubine10anos
      POSTGRES_USER: hubine
      POSTGRES_PASSWORD: hubine_secure_pass_2026
    volumes:
      - hubine10anos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubine -d hubine10anos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  hubine10anos:
    build: .
    container_name: hubine10anos-app
    restart: always
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - APP_URL=http://eventos.hubine.org/dezanos
      - JWT_SECRET=hubine-10-anos-chave-secreta-jwt-2026-vps
      - DATABASE_URL=postgres://hubine:hubine_secure_pass_2026@hubine10anos-db:5432/hubine10anos
    depends_on:
      hubine10anos-db:
        condition: service_healthy
    volumes:
      - hubine10anos_data:/app/data

volumes:
  hubine10anos_data:
  hubine10anos_postgres_data:
